[project]
name = "sabermind"
version = "0.1.0"
description = "Baseball betting trading research and execution tooling"
readme = "README.md"
authors = [
    { name = "LinusJacobsson", email = "jacobssonlinus00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sabermind = "sabermind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
markers = ["integration: tests involving external systems"]

[tool.coverage.run]
source = ["sabermind"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
