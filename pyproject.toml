[project]
name = "sabermind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LinusJacobsson", email = "jacobssonlinus00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sabermind = "sabermind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
